name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate cv*.json parses
        run: |
          for f in lib/cv*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf-8')); console.log('$f is valid JSON')"
          done
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Python
        if: hashFiles('mcp/**') != '' || hashFiles('infra/**') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP dependencies
        if: hashFiles('mcp/**') != ''
        run: pip install -r mcp/requirements-dev.txt
      - name: MCP lint
        if: hashFiles('mcp/**') != ''
        working-directory: mcp
        run: ruff check .
      - name: MCP tests
        if: hashFiles('mcp/**') != ''
        working-directory: mcp
        run: pytest
      - name: Install infra dependencies
        if: hashFiles('infra/**') != ''
        run: pip install -r infra/requirements.txt
      - name: Infra lint
        if: hashFiles('infra/**') != ''
        working-directory: infra
        run: ruff check .
      - name: Infra tests
        if: hashFiles('infra/**') != ''
        working-directory: infra
        run: pytest
      - name: CDK synth
        if: hashFiles('infra/**') != ''
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: sa-east-1
        run: npx --yes aws-cdk@2 synth
